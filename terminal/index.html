  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23050806'/%3E%3Ctext x='5' y='23' font-family='monospace' font-size='16' fill='%2360ffb0'%3E%3E_%3C/text%3E%3C/svg%3E" />

<body>
  <!-- Full-bleed matrix easter-egg canvas -->
  <canvas id="rain" aria-hidden="true"></canvas>

  <!-- The CRT tube -->
  <main id="crt" class="crt" role="application" aria-label="Interactive terminal">
    <div class="bezel">
      <div class="screen" id="screen">
        <div class="rollbar" aria-hidden="true"></div>

        <!-- Boot overlay -->
        <section id="boot" class="boot" aria-hidden="true"></section>

        <!-- Terminal output + live prompt -->
        <section id="term" class="term" hidden>
          <div id="output" class="output" aria-live="polite"></div>

          <div id="promptline" class="promptline" hidden>
            <span class="ps1"><span class="user">dinesh</span><span class="at">@</span><span class="host">brain</span><span class="path">:~$</span></span>
            <span class="inputwrap"><span id="typed" class="typed"></span><span id="caret" class="caret"></span><span id="ghost" class="ghost"></span></span>
          </div>
        </section>

        <!-- Live status HUD (lower third) -->
        <footer id="hud" class="hud" aria-hidden="true">
          <span class="hud-cell"><span class="dot"></span> ONLINE</span>
          <span class="hud-cell" id="hud-loc">Grand Rapids, MI</span>
          <span class="hud-cell" id="hud-mem">mem 0.00%</span>
          <span class="hud-cell" id="hud-clock">--:--:--</span>
        </footer>

      </div>
      <!-- Bezel hardware detail -->
      <div class="bezel-foot">
        <span class="brand">DINESH-OS <b>mk.4</b></span>
        <span class="led" id="led" title="power"></span>
      </div>
    </div>
  </main>

  <!-- Hidden input captures physical keyboard + mobile soft keyboard -->
  <input id="hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1" />
